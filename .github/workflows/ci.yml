name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
          rustup default 1.97.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint base-chain workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Validate research vectors
        shell: bash
        run: |
          set -euo pipefail
          for vector in test-vectors/*.json; do
            python3 -m json.tool "$vector" >/dev/null
          done
      - name: Test base-chain workspace
        run: cargo test --workspace --all-targets --locked
      - name: Check API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Compile transaction, RPC, and P2P fuzz targets
        run: cargo check --manifest-path crates/hyphen-fuzz/Cargo.toml --bins --locked
      - name: Verify published chain identity vectors
        run: cargo test -p hyphen-consensus published_chain_identity_vectors_match_the_implementation --locked
      - name: Reject bincode dependency reintroduction
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n --include='Cargo.toml' --include='Cargo.lock' bincode Cargo.toml Cargo.lock crates; then
            echo 'bincode must not re-enter the Hyphen base-chain dependency graph' >&2
            exit 1
          fi
      - name: Verify excluded DNS resolver is not in the runtime graph
        shell: bash
        run: |
          set -euo pipefail
          if cargo tree --locked -e normal | grep -q 'hickory-'; then
            echo 'hickory unexpectedly entered the built dependency graph' >&2
            exit 1
          fi
          if cargo tree --manifest-path crates/hyphen-fuzz/Cargo.toml --locked -e normal | grep -q 'hickory-'; then
            echo 'hickory unexpectedly entered the fuzz dependency graph' >&2
            exit 1
          fi
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked --version 0.22.0
      - name: Reject new RustSec vulnerabilities
        # No advisory is ignored. libp2p keeps optional DNS/TLS/QUIC packages in
        # Cargo.lock — hickory-*, hyper, h2, rustls, quinn-proto — even though no
        # feature of this workspace enables them (`cargo tree --all-features`
        # proves it, and the step above proves it for DNS); those lock entries are
        # still audited and kept at patched versions, so this step is strict and
        # stays strict.
        run: |
          cargo audit
          cargo audit --file crates/hyphen-fuzz/Cargo.lock

  windows-node-smoke:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      - name: Build Hyphen node
        run: cargo build -p hyphen-node --locked
      - name: Verify devnet chain identity
        shell: pwsh
        run: ./target/debug/hyphen-node.exe --network devnet --print-chain-identity
