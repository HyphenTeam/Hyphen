[workspace]
members = [
    "crates/hyphen-crypto",
    "crates/hyphen-wire",
    "crates/hyphen-core",
    "crates/hyphen-pow",
    "crates/hyphen-proof",
    "crates/hyphen-tx",
    "crates/hyphen-economics",
    "crates/hyphen-state",
    "crates/hyphen-consensus",
    "crates/hyphen-mempool",
    "crates/hyphen-network",
    "crates/hyphen-transport",
    "crates/hyphen-node",
    "crates/hyphen-wallet",
    "crates/hyphen-token",
    "crates/hyphen-rpc",
    "crates/hyphen-vm",
    "crates/hyphen-explorer",
    "crates/hyphen-explorer-web",
    "crates/hyphen-compute",
    "crates/hyphen-neural",
]
exclude = ["crates/hyphen-fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["blueokanna <blueokanna@gmail.com>", "HyphenTeam"]
license-file = "LICENSE"
description = "Privacy-focused research blockchain with scientific computational work and fail-closed AetherCompute settlement"

[workspace.dependencies]
# ── internal crates ──
hyphen-crypto = { path = "crates/hyphen-crypto" }
hyphen-wire = { path = "crates/hyphen-wire" }
hyphen-core = { path = "crates/hyphen-core" }
hyphen-pow = { path = "crates/hyphen-pow" }
hyphen-proof = { path = "crates/hyphen-proof" }
hyphen-tx = { path = "crates/hyphen-tx" }
hyphen-economics = { path = "crates/hyphen-economics" }
hyphen-state = { path = "crates/hyphen-state" }
hyphen-consensus = { path = "crates/hyphen-consensus" }
hyphen-mempool = { path = "crates/hyphen-mempool" }
hyphen-network = { path = "crates/hyphen-network" }
hyphen-node = { path = "crates/hyphen-node" }
hyphen-transport = { path = "crates/hyphen-transport" }
hyphen-wallet = { path = "crates/hyphen-wallet" }
hyphen-token = { path = "crates/hyphen-token" }
hyphen-rpc = { path = "crates/hyphen-rpc" }
hyphen-vm = { path = "crates/hyphen-vm" }
hyphen-explorer = { path = "crates/hyphen-explorer" }
hyphen-explorer-web = { path = "crates/hyphen-explorer-web" }
hyphen-compute = { path = "crates/hyphen-compute" }
hyphen-neural = { path = "crates/hyphen-neural" }

blake3 = "1.8.7"
curve25519-dalek = { version = "5.0.0", features = [
    "serde",
    "digest",
    "rand_core",
] }
ed25519-dalek = { version = "3.0.0", features = ["serde", "rand_core"] }
merlin = "3"

# ── serialisation ──
serde = { version = "1.0.229", features = ["derive"] }
prost = "0.14.4"
prost-types = "0.14.4"

# ── storage ──
sled = "0.34"
zstd = "0.14.3"
wasmi = { version = "2.0.0", default-features = false, features = [
    "stable",
    "std",
    "wat",
    "validate",
    "deterministic",
    "extra-checks",
    "auto-dispatch",
] }
wasmparser = "0.262.0"
wat = "1.262.0"

# ── async / networking ──
tokio = { version = "1.53.3", features = ["full"] }
futures = "0.3.34"
axum = "0.8.9"
courierust = "1.0.9"
libp2p = { version = "0.57", default-features = false, features = [
    "tcp",
    "noise",
    "yamux",
    "gossipsub",
    "kad",
    "identify",
    "ping",
    "request-response",
    "cbor",
    "relay",
    "dcutr",
    "tokio",
    "macros",
    "serde",
    "autonat",
] }

libp2p-allow-block-list = "0.7"
async-trait = "0.1.92"

# ── utilities ──
rand = "0.10.3"
rand_core = "0.10.1"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
rand_chacha = "0.10.0"
thiserror = "2.0.21"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0.154"
parking_lot = "0.12.5"
clap = { version = "4.6.7", features = ["derive"] }
rustbinary = { version = "0.1.8", features = ["derive"] }
tzcraft = { version = "0.1", default-features = false, features = ["std"] }
recurse-x = { version = "0.2", default-features = false, features = [
    "std",
    "dnssec",
    "dot",
    "doh",
] }
zeroize = { version = "1.9.1", features = ["derive"] }

[package]
name = "hyphen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true

[dependencies]
hyphen-crypto.workspace = true
hyphen-core.workspace = true
hyphen-pow.workspace = true
hyphen-proof.workspace = true
hyphen-tx.workspace = true
hyphen-economics.workspace = true
hyphen-state.workspace = true
hyphen-consensus.workspace = true
hyphen-mempool.workspace = true
hyphen-network.workspace = true
hyphen-wallet.workspace = true
hyphen-token.workspace = true
hyphen-rpc.workspace = true
hyphen-vm.workspace = true
hyphen-explorer.workspace = true
