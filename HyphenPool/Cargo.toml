[workspace]

[package]
name = "hyphen-pool-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hyphen-pool-server"
path = "src/main.rs"

[dependencies]
hyphen-core = { path = "../crates/hyphen-core" }
hyphen-crypto = { path = "../crates/hyphen-crypto" }
hyphen-transport = { path = "../crates/hyphen-transport" }
hyphen-consensus = { path = "../crates/hyphen-consensus" }
axum = "0.8.9"
bincode = "1.3.2"
clap = { version = "4.6.4", features = ["derive"] }
parking_lot = "0.12.5"
prost = "0.14.4"
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
