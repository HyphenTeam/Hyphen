[workspace]

[package]
name = "hyphen-miner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hyphen-miner"
path = "src/main.rs"

[dependencies]
hyphen-core = { path = "../crates/hyphen-core" }
hyphen-crypto = { path = "../crates/hyphen-crypto" }
hyphen-pow = { path = "../crates/hyphen-pow" }
bincode = "1.3.2"
clap = { version = "4.6.4", features = ["derive"] }
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
