[package]
name = "hyphen-neural"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
description = "Deterministic fixed-point neural challenge used by the Hyphen Alice contract and Bob miners"

[features]
default = ["std"]
