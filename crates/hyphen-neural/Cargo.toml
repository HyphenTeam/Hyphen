[package]
name = "hyphen-neural"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
description = "Deterministic fixed-point neural challenge used by the Hyphen Alice contract and Bob miners"

[features]
default = ["std"]
std = ["dep:clap", "dep:blake3", "dep:num-bigint"]

[dependencies]
num-bigint = { version = "0.4.8", optional = true }
blake3 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }

[[bin]]
name = "bob-miner"
path = "src/bin/bob_miner.rs"
required-features = ["std"]
