<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Hyphen Chain Observatory</title>
  <style>
    *{box-sizing:border-box}
    :root{
      --ink:#090b0c;--surface:#101416;--raised:#171c1e;--line:#2b3437;
      --text:#e8eeee;--muted:#8e9b9e;--cyan:#4ed9e7;--green:#69dc91;
      --amber:#f1bd57;--coral:#ff765f;--danger:#ff5964;--mono:"Cascadia Code","SFMono-Regular",Consolas,monospace
    }
    html{background:var(--ink);color:var(--text);font-family:Inter,"Segoe UI",sans-serif;letter-spacing:0}
    body{margin:0;min-width:320px;min-height:100vh;background:var(--ink)}
    a{color:var(--cyan);text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
    button,input{font:inherit;letter-spacing:0}button{cursor:pointer}
    .shell{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr auto}
    .topline{height:4px;background:var(--cyan);border-right:33vw solid var(--amber);box-shadow:inset 33vw 0 0 var(--green)}
    header{border-bottom:1px solid var(--line);background:#0d1011;position:sticky;top:0;z-index:20}
    .header-main{height:68px;max-width:1500px;margin:auto;padding:0 24px;display:flex;align-items:center;gap:26px}
    .brand{display:flex;align-items:center;gap:12px;color:var(--text);min-width:max-content}
    .brand:hover{text-decoration:none}.brand-mark{width:32px;height:32px;border:2px solid var(--cyan);display:grid;place-items:center;font:700 15px var(--mono);box-shadow:inset 0 0 0 4px #0d1011, inset 0 0 0 5px var(--line)}
    .brand-copy strong{font:700 15px var(--mono);display:block}.brand-copy span{color:var(--muted);font:10px var(--mono)}
    .runtime{display:flex;gap:8px;align-items:center;margin-left:auto;min-width:max-content}
    .runtime span,.privacy-mark,.age-badge{border:1px solid var(--line);padding:5px 8px;font:10px var(--mono);color:var(--muted)}
    #wasmState.ready{color:var(--green);border-color:#316e46}
    .search{display:flex;flex:0 1 500px;height:38px;border:1px solid var(--line);background:var(--ink)}
    .search:focus-within{border-color:var(--cyan)}
    .search input{width:100%;min-width:100px;border:0;background:transparent;color:var(--text);padding:0 12px;outline:0;font-family:var(--mono);font-size:12px}
    .search button{width:42px;border:0;border-left:1px solid var(--line);background:var(--raised);color:var(--cyan);font:700 16px var(--mono)}
    nav.tabs{height:39px;max-width:1500px;margin:auto;padding:0 24px;display:flex;align-items:stretch;gap:22px}
    nav.tabs a{display:flex;align-items:center;color:var(--muted);font:700 11px var(--mono);border-bottom:2px solid transparent}
    nav.tabs a:hover{text-decoration:none;color:var(--text)}nav.tabs a.active{color:var(--cyan);border-color:var(--cyan)}
    main{width:100%;max-width:1500px;margin:0 auto;padding:24px;min-height:620px}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:var(--surface)}
    .metric{min-width:0;padding:17px 18px;border-right:1px solid var(--line)}.metric:last-child{border-right:0}
    .metric span{display:block;color:var(--muted);font:10px var(--mono);margin-bottom:7px}.metric strong{display:block;font:600 22px var(--mono);overflow:hidden;text-overflow:ellipsis}
    .cyan{color:var(--cyan)}.green{color:var(--green)}.amber{color:var(--amber)}.coral{color:var(--coral)}
    .chain-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-top:0;background:#0c0f10}
    .chain-strip div{min-width:0;padding:10px 14px;border-right:1px solid var(--line)}.chain-strip div:last-child{border:0}
    .chain-strip span{display:block;color:var(--muted);font:9px var(--mono);margin-bottom:4px}.chain-strip b{display:block;font:11px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .section-head{min-height:80px;display:flex;align-items:end;justify-content:space-between;gap:20px;padding:18px 0 14px}
    .section-head h1{font:600 23px var(--mono);margin:3px 0 0}.kicker{font:10px var(--mono);color:var(--muted)}
    .live{color:var(--green);font:700 10px var(--mono);display:flex;align-items:center;gap:7px}.live:before{content:"";width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 9px var(--green)}
    .data-table{overflow:auto;border:1px solid var(--line);background:var(--surface)}
    table{width:100%;min-width:900px;border-collapse:collapse;font:12px var(--mono)}
    th{padding:10px 12px;text-align:left;color:var(--muted);background:#0c0f10;border-bottom:1px solid var(--line);font-size:9px;white-space:nowrap}
    td{padding:12px;border-bottom:1px solid #202729;vertical-align:middle;white-space:nowrap}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#151a1c}
    td small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.hash{font-family:var(--mono);color:#a8e7ec}.amount{color:var(--green)}
    .pager{display:flex;justify-content:flex-end;align-items:center;gap:0;margin-top:12px;font:10px var(--mono)}
    .pager button,.pager span{height:34px;padding:0 14px;border:1px solid var(--line);background:var(--surface);color:var(--text)}.pager span{display:grid;place-items:center;border-left:0;border-right:0;color:var(--muted)}.pager button:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}.pager button:disabled{cursor:not-allowed;color:#465053}
    .domain-band{border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:20px;padding:11px 14px;margin-bottom:12px;font:10px var(--mono)}.domain-band b{color:var(--amber)}.domain-band span{color:var(--muted);margin-left:auto}
    .status{display:inline-block;padding:4px 7px;border:1px solid var(--line);font:700 9px var(--mono);text-transform:uppercase}.status.ok{color:var(--green);border-color:#316e46}.status.pending{color:var(--amber);border-color:#765b2b}.status.bad{color:var(--danger);border-color:#78343b}.status.open{color:var(--cyan);border-color:#286b73}
    .detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.detail-grid.single{grid-template-columns:minmax(0,900px)}
    article{border:1px solid var(--line);background:var(--surface);min-width:0}article h2,.object-list h2{margin:0;padding:11px 14px;border-bottom:1px solid var(--line);background:#0c0f10;color:var(--muted);font:700 10px var(--mono);text-transform:uppercase}
    dl{display:grid;grid-template-columns:150px minmax(0,1fr);margin:0;font:11px var(--mono)}dt,dd{margin:0;padding:10px 12px;border-bottom:1px solid #202729;min-width:0}dt{color:var(--muted)}dd{border-left:1px solid #202729;overflow-wrap:anywhere}.full-hash{color:#b7dadd}
    .object-list{margin-top:12px;border:1px solid var(--line);background:var(--surface)}.object-list>a{display:grid;grid-template-columns:150px 1fr;gap:15px;padding:10px 14px;border-bottom:1px solid #202729;font:11px var(--mono)}.object-list>a b{color:var(--muted);font-weight:400;overflow-wrap:anywhere}.list-meta,.empty{margin:0;padding:12px 14px;color:var(--muted);font:10px var(--mono)}
    .loading,.error{border:1px solid var(--line);margin-top:22px;padding:24px;font:12px var(--mono);color:var(--muted)}.loading:before{content:"";display:inline-block;width:8px;height:8px;background:var(--cyan);margin-right:10px;animation:blink 1s steps(2) infinite}.error{border-color:#673036;color:#ff9ba2}
    footer{border-top:1px solid var(--line);padding:15px 24px;color:var(--muted);font:9px var(--mono);display:flex;justify-content:space-between;gap:20px}footer b{color:var(--green)}
    @keyframes blink{50%{opacity:.15}}
    @media(max-width:900px){.header-main{height:auto;min-height:68px;flex-wrap:wrap;padding:12px 16px;gap:12px}.search{order:3;flex-basis:100%}.runtime{margin-left:auto}nav.tabs{padding:0 16px}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(2){border-right:0}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}.chain-strip{grid-template-columns:repeat(3,1fr)}.chain-strip div:nth-child(3){border-right:0}.chain-strip div:nth-child(-n+3){border-bottom:1px solid var(--line)}main{padding:16px}.detail-grid{grid-template-columns:1fr}}
    @media(max-width:540px){.brand-copy span,.runtime span:first-child{display:none}.metrics{grid-template-columns:1fr}.metric{border-right:0;border-bottom:1px solid var(--line)!important}.metric:last-child{border-bottom:0!important}.chain-strip{grid-template-columns:repeat(2,1fr)}.chain-strip div{border-bottom:1px solid var(--line)!important}.chain-strip div:nth-child(even){border-right:0}.chain-strip div:nth-last-child(-n+2){border-bottom:0!important}.domain-band{align-items:flex-start;flex-wrap:wrap}.domain-band span{width:100%;margin:0}.section-head h1{font-size:18px}dl{grid-template-columns:110px minmax(0,1fr)}footer{flex-direction:column}}
  </style>
</head>
<body>
  <div class="topline"></div>
  <div class="shell">
    <header>
      <div class="header-main">
        <a class="brand" href="#/" aria-label="Hyphen overview"><span class="brand-mark">H-</span><span class="brand-copy"><strong>HYPHEN</strong><span>CHAIN OBSERVATORY</span></span></a>
        <form class="search" id="searchForm"><input id="searchInput" autocomplete="off" spellcheck="false" aria-label="Search chain" placeholder="height / block / transaction / task"><button type="submit" title="Search" aria-label="Search">&gt;</button></form>
        <div class="runtime"><span>RUST CORE</span><span id="wasmState">WASM BOOT</span></div>
      </div>
      <nav class="tabs" aria-label="Explorer sections"><a href="#/" data-route="home">OVERVIEW</a><a href="#/science" data-route="science">AETHERCOMPUTE</a><a href="#/apps" data-route="apps">WASM APPS</a></nav>
    </header>
    <main id="content"><div class="loading">INITIALIZING RUST WASM RUNTIME</div></main>
    <footer><span>PUBLIC COMMITMENTS ONLY &middot; NO WALLET TELEMETRY &middot; NO THIRD-PARTY ASSETS</span><b>HYPHEN NODE / SAME ORIGIN</b></footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
