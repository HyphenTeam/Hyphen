[package]
name = "hyphen-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
authors = ["blueokanna <blueokanna@gmail.com>", "HyphenTeam"]
license-file = "LICENSE"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
prost = "0.14.6"
rustbinary = { version = "0.1.10", features = ["derive"] }
hyphen-network = { path = "../hyphen-network" }
hyphen-rpc = { path = "../hyphen-rpc" }
hyphen-tx = { path = "../hyphen-tx" }

[[bin]]
name = "transaction_decode"
path = "fuzz_targets/transaction_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rpc_decode"
path = "fuzz_targets/rpc_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "p2p_decode"
path = "fuzz_targets/p2p_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_decode"
path = "fuzz_targets/codec_decode.rs"
test = false
doc = false
bench = false
