[package]
name = "hyphen-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "PolyForm-Strict-1.0.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
prost = "0.14.4"
rustbinary = { version = "0.1.2", features = ["derive"] }
hyphen-network = { path = "../hyphen-network" }
hyphen-rpc = { path = "../hyphen-rpc" }
hyphen-tx = { path = "../hyphen-tx" }

[[bin]]
name = "transaction_decode"
path = "fuzz_targets/transaction_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rpc_decode"
path = "fuzz_targets/rpc_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "p2p_decode"
path = "fuzz_targets/p2p_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_decode"
path = "fuzz_targets/codec_decode.rs"
test = false
doc = false
bench = false

[patch.crates-io]
# This is an independent workspace and does not inherit the root patch.
proc-macro-error2 = { path = "../../vendor/proc-macro-error2" }
