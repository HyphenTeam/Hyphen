[package]
name = "alice-neural-contract"
version = "0.1.1"
edition = "2021"
authors = ["blueokanna <blueokanna@gmail.com>", "HyphenTeam"]
license-file = "LICENSE"
description = "On-chain Alice challenge contract for the Hyphen neural proof-of-work profile"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
hyphen-neural = { path = "../../crates/hyphen-neural", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
overflow-checks = true
